<div class="webp-container">
  <div
    class="webp-banner"
    [ngStyle]="{
      'background-image': 'url(' + bannerUrl + ')',
      'height.px': bannerHeight
    }"
  >
    <div class="webp-banner__overlay"></div>
    <div class="webp-banner__text">
      <h2>GENERACIÓN DE IMÁGENES</h2>
      <p>
        Inspírate y crea imágenes únicas a partir de tus ideas o transforma
        fotos en nuevas obras.
      </p>
    </div>
  </div>
  <div class="menu-grid">
    <mat-card
      class="mat-elevation-z2 menu-card"
      routerLink="/webp/360"
      style="cursor: pointer"
    >
      <mat-card-header>
        <h2>Webp 360°</h2>
      </mat-card-header>

      <!-- Media del card -->
      <div class="card-media">
        <video
          class="card-media-el"
          autoplay
          muted
          loop
          playsinline
          preload="metadata"
          poster="images/LogoPump.png"
        >
          <source src="/videos/360.mp4" type="video/mp4" />
          Tu navegador no soporta video HTML5.
        </video>
      </div>

      <mat-card-actions>
        <button mat-button class="btn-color" (click)="goTo360()">Entrar</button>
      </mat-card-actions>
    </mat-card>

    <mat-card
      class="mat-elevation-z2 menu-card"
      routerLink="/webp/360"
      style="cursor: pointer"
    >
      <mat-card-header>
        <h2>Webp dinámico</h2>
      </mat-card-header>

      <!-- Media del card -->
      <div class="card-media">
        <video
          class="card-media-el"
          autoplay
          muted
          loop
          playsinline
          preload="metadata"
          poster="/images/LogoPump.png"
        >
          <source src="/videos/image.mp4" type="video/mp4" />
          Tu navegador no soporta video HTML5.
        </video>
      </div>

      <mat-card-actions>
        <button mat-button class="btn-color" (click)="goToFree()">
          Entrar
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
